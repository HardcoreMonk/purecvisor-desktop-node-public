name: Development Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Legacy rollback-only reference (not executed): Invoke-PcvDevelopmentVerification.ps1
# Legacy rollback-only step name (not executed): - name: Install exact Pester
# Legacy rollback-only step name (not executed): - name: Validate canonical current evidence
jobs:
  dotnet-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/**/*.csproj') }}
      - name: Restore and build
        shell: cmd
        run: dotnet restore src/DesktopNode.sln && dotnet build src/DesktopNode.sln -c Release --no-restore
      - name: Run legacy dotnet
        shell: cmd
        env:
          PCV_TRX_ROOT: ${{ runner.temp }}\pcv-legacy-dotnet-${{ github.run_id }}
          PCV_LEGACY_OUTPUT: artifacts\shadow\dotnet\legacy\summary.json
          PCV_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          dotnet test src/DesktopNode.sln -c Release --no-restore --no-build --logger trx --results-directory "%PCV_TRX_ROOT%" --nologo
          set "PCV_LEGACY_EXIT=%ERRORLEVEL%"
          node -e "const fs=require('fs'),p=require('path'),c=require('crypto');const root=process.env.PCV_TRX_ROOT,files=fs.readdirSync(root).filter(x=>x.endsWith('.trx')).sort();if(!files.length)throw new Error('PCV_SHADOW_TRX_MISSING');let total=0,passed=0,failed=0,skipped=0,start=Infinity,finish=0;const digest=c.createHash('sha256');for(const file of files){const raw=fs.readFileSync(p.join(root,file));digest.update(raw);const text=raw.toString('utf8'),cm=/<Counters\b([^>]*)\/?\s*>/u.exec(text),tm=/<Times\b([^>]*)\/?\s*>/u.exec(text);if(!cm||!tm)throw new Error('PCV_SHADOW_TRX_SCHEMA');const attrs=Object.fromEntries([...cm[1].matchAll(/([A-Za-z]+)=\x22([^\x22]*)\x22/gu)].map(x=>[x[1],x[2]])),times=Object.fromEntries([...tm[1].matchAll(/([A-Za-z]+)=\x22([^\x22]*)\x22/gu)].map(x=>[x[1],x[2]]));total+=Number(attrs.total);passed+=Number(attrs.passed);failed+=Number(attrs.failed)+Number(attrs.error)+Number(attrs.timeout)+Number(attrs.aborted);skipped+=Number(attrs.notExecuted);start=Math.min(start,Date.parse(times.start));finish=Math.max(finish,Date.parse(times.finish));}if(!/^[0-9a-f]{40}$/u.test(process.env.PCV_HEAD_SHA)||![total,passed,failed,skipped,start,finish].every(Number.isFinite)||total!==passed+failed+skipped)throw new Error('PCV_SHADOW_TRX_COUNTER');const out={schema_version:1,contract:'pcv-required-ci-shadow-legacy-summary-v1',head_sha:process.env.PCV_HEAD_SHA,label:'dotnet',source_kind:'trx-set',source_file_count:files.length,total,passed,failed,skipped,not_run:0,duration_ms:Math.max(0,finish-start),result_sha256:digest.digest('hex'),host_mutation_performed:false};fs.mkdirSync(p.dirname(process.env.PCV_LEGACY_OUTPUT),{recursive:true});fs.writeFileSync(process.env.PCV_LEGACY_OUTPUT,JSON.stringify(out)+'\n',{encoding:'utf8'});"
          if errorlevel 1 exit /b 1
          exit /b %PCV_LEGACY_EXIT%
      - name: Prepare replacement dotnet manifest summary
        shell: cmd
        env:
          PCV_REPLACEMENT_ROOT: artifacts\shadow\dotnet\replacement
          PCV_REPLACEMENT_SHARD: dotnet
          PCV_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PCV_TEST_RESULT_COUNT: "0"
        run: node -e "const fs=require('fs'),p=require('path');const m=JSON.parse(fs.readFileSync('config/development-verification-migration-manifest.json','utf8')),rows=m.contracts;if(!/^[0-9a-f]{40}$/u.test(process.env.PCV_HEAD_SHA)||m.inventory.contracts.total!==627||rows.some(r=>r.parity_status!=='mapped'||r.local_parity.status!=='pass'||r.ci_parity.status!=='pending'))throw new Error('PCV_SHADOW_MANIFEST_INVALID');const out={schema_version:1,contract:'pcv-required-ci-shadow-replacement-manifest-summary-v1',head_sha:process.env.PCV_HEAD_SHA,shard:process.env.PCV_REPLACEMENT_SHARD,contracts_total:rows.length,mapped:rows.length,local_pass:rows.length,ci_pending:rows.length,domain_contract_counts:m.inventory.contracts,test_result_count:Number(process.env.PCV_TEST_RESULT_COUNT),host_mutation_performed:false};fs.mkdirSync(process.env.PCV_REPLACEMENT_ROOT,{recursive:true});fs.writeFileSync(p.join(process.env.PCV_REPLACEMENT_ROOT,'manifest-summary.json'),JSON.stringify(out)+'\n');"
      - name: Run replacement dotnet
        shell: cmd
        run: dotnet run --project src\DesktopNode.Verification -c Release --no-build --no-restore -- verify --lane Full --change-tier M --changed-path .github/workflows/development-gates.yml --artifact-root artifacts/shadow/dotnet/replacement --shard dotnet
      - name: Upload legacy-dotnet
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: legacy-dotnet
          path: artifacts/shadow/dotnet/legacy
          if-no-files-found: error
      - name: Upload replacement-dotnet
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: replacement-dotnet
          path: artifacts/shadow/dotnet/replacement
          if-no-files-found: error

  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore and build verifier
        run: dotnet restore src/DesktopNode.Verification/DesktopNode.Verification.csproj && dotnet build src/DesktopNode.Verification/DesktopNode.Verification.csproj -c Release --no-restore
      - name: Install Web dependencies
        run: npm ci --prefix web
      - name: Run legacy web
        env:
          PCV_LEGACY_OUTPUT: artifacts/shadow/web/legacy/summary.json
          PCV_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          started=$(node -p "Date.now()")
          set +e
          npm test --prefix web
          test_exit=$?
          npm run verify:parity --prefix web
          parity_exit=$?
          set -e
          completed=$(node -p "Date.now()")
          PCV_TEST_EXIT=$test_exit PCV_PARITY_EXIT=$parity_exit PCV_DURATION_MS=$((completed-started)) node -e "const fs=require('fs'),p=require('path'),c=require('crypto');const exits=[Number(process.env.PCV_TEST_EXIT),Number(process.env.PCV_PARITY_EXIT)],duration=Number(process.env.PCV_DURATION_MS),passed=exits.filter(x=>x===0).length,failed=exits.length-passed,canonical=[process.env.PCV_HEAD_SHA,...exits,duration].join('|');if(!/^[0-9a-f]{40}$/u.test(process.env.PCV_HEAD_SHA)||!exits.every(Number.isInteger)||!Number.isInteger(duration))throw new Error('PCV_SHADOW_WEB_COUNTER');const out={schema_version:1,contract:'pcv-required-ci-shadow-legacy-summary-v1',head_sha:process.env.PCV_HEAD_SHA,label:'web',source_kind:'command-pair',total:2,passed,failed,skipped:0,not_run:0,duration_ms:duration,result_sha256:c.createHash('sha256').update(canonical).digest('hex'),host_mutation_performed:false};fs.mkdirSync(p.dirname(process.env.PCV_LEGACY_OUTPUT),{recursive:true});fs.writeFileSync(process.env.PCV_LEGACY_OUTPUT,JSON.stringify(out)+'\n');"
          if [ "$test_exit" -ne 0 ] || [ "$parity_exit" -ne 0 ]; then exit 1; fi
      - name: Prepare replacement web manifest summary
        env:
          PCV_REPLACEMENT_ROOT: artifacts/shadow/web/replacement
          PCV_REPLACEMENT_SHARD: web
          PCV_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PCV_TEST_RESULT_COUNT: "50"
        run: node -e "const fs=require('fs'),p=require('path');const m=JSON.parse(fs.readFileSync('config/development-verification-migration-manifest.json','utf8')),rows=m.contracts;if(!/^[0-9a-f]{40}$/u.test(process.env.PCV_HEAD_SHA)||m.inventory.contracts.total!==627||rows.some(r=>r.parity_status!=='mapped'||r.local_parity.status!=='pass'||r.ci_parity.status!=='pending'))throw new Error('PCV_SHADOW_MANIFEST_INVALID');const out={schema_version:1,contract:'pcv-required-ci-shadow-replacement-manifest-summary-v1',head_sha:process.env.PCV_HEAD_SHA,shard:process.env.PCV_REPLACEMENT_SHARD,contracts_total:rows.length,mapped:rows.length,local_pass:rows.length,ci_pending:rows.length,domain_contract_counts:m.inventory.contracts,test_result_count:Number(process.env.PCV_TEST_RESULT_COUNT),host_mutation_performed:false};fs.mkdirSync(process.env.PCV_REPLACEMENT_ROOT,{recursive:true});fs.writeFileSync(p.join(process.env.PCV_REPLACEMENT_ROOT,'manifest-summary.json'),JSON.stringify(out)+'\n');"
      - name: Run replacement web
        run: dotnet run --project src/DesktopNode.Verification -c Release --no-build --no-restore -- verify --lane Full --change-tier M --changed-path web/package.json --artifact-root artifacts/shadow/web/replacement --shard web
      - name: Upload legacy-web
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: legacy-web
          path: artifacts/shadow/web/legacy
          if-no-files-found: error
      - name: Upload replacement-web
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: replacement-web
          path: artifacts/shadow/web/replacement
          if-no-files-found: error

  packaging-pester:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/**/*.csproj') }}
      - name: Restore and build verification projects
        shell: cmd
        run: dotnet restore src\DesktopNode.Verification\DesktopNode.Verification.csproj && dotnet restore src\DesktopNode.Delivery.Tests\DesktopNode.Delivery.Tests.csproj && dotnet build src\DesktopNode.Verification\DesktopNode.Verification.csproj -c Release --no-restore && dotnet build src\DesktopNode.Delivery.Tests\DesktopNode.Delivery.Tests.csproj -c Release --no-restore
      - name: Run legacy packaging Pester
        shell: pwsh
        env:
          PCV_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          $fixturePresent = Test-Path -LiteralPath 'artifacts/admin-smoke-package-20260716-04265/host-publish/DesktopNode.Host.exe' -PathType Leaf
          $result = Invoke-Pester -Path 'packaging/windows-desktop-node/tests' -Output Detailed -PassThru
          $durationMs = [int64][Math]::Round($result.Duration.TotalMilliseconds)
          $canonical = [string]::Join('|', @($env:PCV_HEAD_SHA, $result.TotalCount, $result.PassedCount, $result.FailedCount, $result.SkippedCount, $result.NotRunCount, $durationMs))
          $digest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($canonical))).ToLowerInvariant()
          $summary = [ordered]@{ schema_version = 1; contract = 'pcv-required-ci-shadow-legacy-summary-v1'; head_sha = $env:PCV_HEAD_SHA; label = 'packaging'; source_kind = 'pester-result'; total = $result.TotalCount; passed = $result.PassedCount; failed = $result.FailedCount; skipped = $result.SkippedCount; not_run = $result.NotRunCount; duration_ms = $durationMs; result_sha256 = $digest; frozen_binary_execution_count = $(if ($fixturePresent) { 2 } else { 0 }); immutable_evidence_fallback_count = $(if ($fixturePresent) { 0 } else { 2 }); host_mutation_performed = $false }
          $output = Join-Path (Get-Location) 'artifacts/shadow/delivery/legacy/summary.json'
          [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($output)) | Out-Null
          [IO.File]::WriteAllText($output, (($summary | ConvertTo-Json -Compress) + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          if ($result.TotalCount -ne 528 -or $result.FailedCount -ne 0 -or $result.SkippedCount -ne 0 -or $result.NotRunCount -ne 0) { exit 1 }
      - name: Prepare replacement delivery manifest summary
        shell: cmd
        env:
          PCV_REPLACEMENT_ROOT: artifacts\shadow\delivery\replacement
          PCV_REPLACEMENT_SHARD: delivery
          PCV_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PCV_TEST_RESULT_COUNT: "528"
        run: node -e "const fs=require('fs'),p=require('path');const m=JSON.parse(fs.readFileSync('config/development-verification-migration-manifest.json','utf8')),rows=m.contracts;if(!/^[0-9a-f]{40}$/u.test(process.env.PCV_HEAD_SHA)||m.inventory.contracts.total!==627||rows.some(r=>r.parity_status!=='mapped'||r.local_parity.status!=='pass'||r.ci_parity.status!=='pending'))throw new Error('PCV_SHADOW_MANIFEST_INVALID');const out={schema_version:1,contract:'pcv-required-ci-shadow-replacement-manifest-summary-v1',head_sha:process.env.PCV_HEAD_SHA,shard:process.env.PCV_REPLACEMENT_SHARD,contracts_total:rows.length,mapped:rows.length,local_pass:rows.length,ci_pending:rows.length,domain_contract_counts:m.inventory.contracts,test_result_count:Number(process.env.PCV_TEST_RESULT_COUNT),host_mutation_performed:false};fs.mkdirSync(process.env.PCV_REPLACEMENT_ROOT,{recursive:true});fs.writeFileSync(p.join(process.env.PCV_REPLACEMENT_ROOT,'manifest-summary.json'),JSON.stringify(out)+'\n');"
      - name: Run replacement delivery
        shell: cmd
        run: dotnet run --project src\DesktopNode.Verification -c Release --no-build --no-restore -- verify --lane Full --change-tier M --changed-path packaging/windows-desktop-node/tests/PcvAdminSmokeEvidenceDocs.Tests.ps1 --artifact-root artifacts/shadow/delivery/replacement --shard delivery
      - name: Upload legacy-packaging
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: legacy-packaging
          path: artifacts/shadow/delivery/legacy
          if-no-files-found: error
      - name: Upload replacement-delivery
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: replacement-delivery
          path: artifacts/shadow/delivery/replacement
          if-no-files-found: error

  installer-web-pester:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/**/*.csproj') }}
      - name: Restore and build verification projects
        shell: cmd
        run: dotnet restore src\DesktopNode.Verification\DesktopNode.Verification.csproj && dotnet restore src\DesktopNode.Delivery.Tests\DesktopNode.Delivery.Tests.csproj && dotnet build src\DesktopNode.Verification\DesktopNode.Verification.csproj -c Release --no-restore && dotnet build src\DesktopNode.Delivery.Tests\DesktopNode.Delivery.Tests.csproj -c Release --no-restore
      - name: Install Web dependencies for shadow parity
        shell: cmd
        run: npm ci --prefix web
      - name: Run legacy installer and Web Pester
        shell: pwsh
        env:
          PCV_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          $result = Invoke-Pester -Path @('packaging/windows-desktop-node/installer/tests', 'web/tests') -Output Detailed -PassThru
          $durationMs = [int64][Math]::Round($result.Duration.TotalMilliseconds)
          $canonical = [string]::Join('|', @($env:PCV_HEAD_SHA, $result.TotalCount, $result.PassedCount, $result.FailedCount, $result.SkippedCount, $result.NotRunCount, $durationMs))
          $digest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($canonical))).ToLowerInvariant()
          $summary = [ordered]@{ schema_version = 1; contract = 'pcv-required-ci-shadow-legacy-summary-v1'; head_sha = $env:PCV_HEAD_SHA; label = 'installer-web'; source_kind = 'pester-result'; total = $result.TotalCount; passed = $result.PassedCount; failed = $result.FailedCount; skipped = $result.SkippedCount; not_run = $result.NotRunCount; duration_ms = $durationMs; result_sha256 = $digest; host_mutation_performed = $false }
          $output = Join-Path (Get-Location) 'artifacts/shadow/installer-policy/legacy/summary.json'
          [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($output)) | Out-Null
          [IO.File]::WriteAllText($output, (($summary | ConvertTo-Json -Compress) + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          if ($result.TotalCount -ne 99 -or $result.FailedCount -ne 0 -or $result.SkippedCount -ne 0 -or $result.NotRunCount -ne 0) { exit 1 }
      - name: Prepare replacement installer-policy manifest summary
        shell: cmd
        env:
          PCV_REPLACEMENT_ROOT: artifacts\shadow\installer-policy\replacement
          PCV_REPLACEMENT_SHARD: installer-policy
          PCV_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PCV_TEST_RESULT_COUNT: "99"
        run: node -e "const fs=require('fs'),p=require('path');const m=JSON.parse(fs.readFileSync('config/development-verification-migration-manifest.json','utf8')),rows=m.contracts;if(!/^[0-9a-f]{40}$/u.test(process.env.PCV_HEAD_SHA)||m.inventory.contracts.total!==627||rows.some(r=>r.parity_status!=='mapped'||r.local_parity.status!=='pass'||r.ci_parity.status!=='pending'))throw new Error('PCV_SHADOW_MANIFEST_INVALID');const out={schema_version:1,contract:'pcv-required-ci-shadow-replacement-manifest-summary-v1',head_sha:process.env.PCV_HEAD_SHA,shard:process.env.PCV_REPLACEMENT_SHARD,contracts_total:rows.length,mapped:rows.length,local_pass:rows.length,ci_pending:rows.length,domain_contract_counts:m.inventory.contracts,test_result_count:Number(process.env.PCV_TEST_RESULT_COUNT),host_mutation_performed:false};fs.mkdirSync(process.env.PCV_REPLACEMENT_ROOT,{recursive:true});fs.writeFileSync(p.join(process.env.PCV_REPLACEMENT_ROOT,'manifest-summary.json'),JSON.stringify(out)+'\n');"
      - name: Run replacement installer-policy
        shell: cmd
        run: npm run test:web-contracts --prefix web && dotnet run --project src\DesktopNode.Verification -c Release --no-build --no-restore -- verify --lane Full --change-tier M --changed-path packaging/windows-desktop-node/installer/tests/PcvDesktopNodeInstaller.Plan.Tests.ps1 --artifact-root artifacts/shadow/installer-policy/replacement --shard installer-policy
      - name: Upload legacy-installer-web
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: legacy-installer-web
          path: artifacts/shadow/installer-policy/legacy
          if-no-files-found: error
      - name: Upload replacement-installer-policy
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: replacement-installer-policy
          path: artifacts/shadow/installer-policy/replacement
          if-no-files-found: error
